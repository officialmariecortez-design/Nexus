<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Markets — Admin Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#f6f8fb;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}.card{width:min(430px,92vw);background:#0d1b2d;border:1px solid #1f3550;border-radius:18px;padding:34px;box-shadow:0 24px 70px #0008}.brand{font-size:26px;font-weight:800;letter-spacing:.04em}.muted{color:#9fb0c5;line-height:1.6}.label{display:block;margin:18px 0 7px;color:#c8d4e3;font-size:14px}input{width:100%;padding:14px 15px;border:1px solid #304863;background:#081522;color:white;border-radius:10px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#2d8cff;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.error{margin-top:14px;color:#ff8d8d;min-height:20px;font-size:14px}.back{display:inline-block;margin-top:20px;color:#9fc9ff;text-decoration:none;font-size:14px}</style></head><body><main class="card"><div class="brand">NEXUS MARKETS</div><p class="muted">Administrator portal. This is separate from the customer login.</p><form id="form"><label class="label">Admin email</label><input id="email" type="email" autocomplete="username" required><label class="label">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Sign in as Admin</button><div id="error" class="error"></div></form><a class="back" href="/">← Back to website</a></main><script>const f=document.getElementById('form'),b=document.getElementById('btn'),e=document.getElementById('error');f.addEventListener('submit',async ev=>{ev.preventDefault();e.textContent='';b.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to sign in');localStorage.setItem('nexus_admin_token',d.token);location.href='/admin.html'}catch(x){e.textContent=x.message}finally{b.disabled=false}})</script></body></html>
